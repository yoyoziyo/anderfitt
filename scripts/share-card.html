<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prévia de compartilhamento ANDERFIT</title>
<style>
@font-face{font-family:Anderfit;src:url('../src/assets/fonts/roboto-black.ttf');font-weight:900}
@font-face{font-family:Anderfit;src:url('../src/assets/fonts/roboto-regular.ttf');font-weight:400}
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000;color:#fff;font-family:Anderfit,sans-serif}
.card{height:630px;display:flex;align-items:center;padding:64px 72px 70px 34px;gap:10px;position:relative}
.logo{width:400px;height:400px;object-fit:contain;flex-shrink:0}
.content{flex:1}.eyebrow{font-size:22px;letter-spacing:5px;font-weight:900;color:#ff6b00;margin-bottom:18px}
h1{font-size:85px;line-height:1;letter-spacing:2px;margin:0 0 28px;font-weight:900}
.tagline{font-size:35px;line-height:1.3;margin:0;font-weight:900}
.details{font-size:25px;line-height:1.5;color:#b7b7bb;margin:22px 0 0}
.footer{position:absolute;bottom:51px;left:468px;color:#ff6b00;font-size:20px;font-weight:900;letter-spacing:1.5px}
</style>
</head>
<body><main class="card">
<img class="logo" src="../src/assets/logo.png" alt="Logo ANDERFIT">
<div class="content"><div class="eyebrow">FORÇA. FOCO. EVOLUÇÃO.</div><h1>ANDERFIT</h1><p class="tagline">Seu resultado.<br>Nosso compromisso.</p><p class="details">Treinos, medidas e evolução<br>em um só lugar.</p></div>
<div class="footer">ACESSO DO ALUNO E DO PERSONAL</div>
</main></body></html>
