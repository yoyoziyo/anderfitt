name: ANDERFIT Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Conferir arquivos privados
        run: node scripts/check-secrets.mjs
      - run: flutter pub get
        working-directory: src
      - run: flutter analyze
        working-directory: src
      - run: flutter test
        working-directory: src
      - name: Compilar site
        run: flutter build web --release --no-web-resources-cdn --no-source-maps
        working-directory: src
      - name: Conferir pacote web
        run: node scripts/check-web.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: anderfit-web
          path: src/build/web
          retention-days: 7
      - name: Publicar na Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy src/build/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
