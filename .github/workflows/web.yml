name: ANDERFIT Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Conferir arquivos privados
        run: node scripts/check-secrets.mjs
      - run: flutter pub get
        working-directory: src
      - run: flutter analyze
        working-directory: src
      - run: flutter test
        working-directory: src
      - name: Compilar site para GitHub Pages
        run: flutter build web --release --base-href /anderfitt/ --no-web-resources-cdn --no-source-maps
        working-directory: src
      - name: Conferir pacote web
        run: node scripts/check-web.mjs /anderfitt/
      - uses: actions/upload-artifact@v4
        with:
          name: anderfit-web
          path: src/build/web
          retention-days: 7
      - name: Preparar pacote do GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
